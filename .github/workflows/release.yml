name: Trivium Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build
        shell: cmd

      - name: Generate Multi-Resolution Desktop Icon
        run: |
          uv run --with pillow python -c "from PIL import Image; from pathlib import Path; img = Image.open('frontend/public/trivium-logo.png').convert('RGBA'); Path('assets').mkdir(exist_ok=True); img.save('assets/trivium.ico', format='ICO', sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])"
        shell: cmd

      - name: Build Standalone Desktop Executable
        run: |
          uv run build_desktop.py
        shell: cmd

      - name: Package Release ZIP
        run: |
          mkdir release_pkg
          copy dist_desktop\Trivium.exe release_pkg\
          copy Trivium-Launcher.bat release_pkg\
          copy Trivium-Dev-Console.bat release_pkg\
          copy README.md release_pkg\
          copy LICENSE release_pkg\
          copy .env.example release_pkg\.env.example
          xcopy assets release_pkg\assets\ /E /I
          powershell Compress-Archive -Path release_pkg\* -DestinationPath Trivium-Windows-x64.zip
        shell: cmd

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Trivium-Windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
